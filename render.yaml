# Render Blueprint for MediLens (native Python runtime, no Docker).
# Deploy: push the repo to GitHub, then Render dashboard > New > Blueprint.
# Render asks for GEMINI_API_KEY (marked sync: false); everything else is set here.

databases:
  - name: medilens-db
    databaseName: medilens
    user: medilens
    # Free Postgres is deleted 30 days after creation (14-day grace to upgrade).
    # Fine for a demo; switch to a paid plan before you rely on the data.
    plan: free
    ipAllowList: []   # internal connections only (no access from the public internet)

services:
  - type: web
    name: medilens
    runtime: python
    # PyTorch + xgboost + shap need well over 512 MB of RAM, so the 512 MB
    # "free" and "starter" instances will most likely be killed for running out
    # of memory. "standard" has 2 GB.
    plan: standard
    # PyTorch is installed first from its CPU-only index (the default Linux wheel
    # bundles CUDA: ~2 GB of downloads this app never uses).
    buildCommand: pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /login
    envVars:
      # Pinned: the project's torch/numpy versions don't support Python 3.13.
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medilens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
